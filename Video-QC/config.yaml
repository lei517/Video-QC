# ============ 视频 QC 机审工具配置 ============

# 报告"来源"列固定值
source: 机审

# 从文件名解析"集数"的正则（第一个捕获组为集数），解析失败则为 0
episode_pattern: "[Ee][Pp](\\d+)"

# 需要启用的检测器（false 即跳过）
detectors:
  black_frame: true      # 黑帧
  frame_freeze: true     # 跳帧/冻结
  black_border: true     # 黑边（画面不铺满）
  audio_clipping: true   # 爆音

thresholds:
  # 黑帧：双分支——①99%像素近黑（容忍零星亮点，抓切镜黑闪帧）②整帧均匀近黑
  black_frame:
    mean_strict: 8           # 分支①平均亮度上限（真黑帧 mean≈0-4）
    p99_threshold: 32        # 分支① p99 亮度上限（夜景暗场景 p99≈44 被排除）
    mean_threshold: 20       # 分支②平均亮度上限
    max_luma: 48             # 分支②最高亮度上限（有灯光/招牌即超过，排除暗场景）
    sample_fps: 0            # 0=全帧率逐帧解码（单帧黑闪也能抓），>0 为每秒采样数
    min_duration: 0.03       # 最短持续时长（秒），0.03≈单帧

  # 跳帧：四通道——冻结 / 时间戳断裂 / 重复帧卡顿 / 突变坏帧
  frame_freeze:
    noise_db: -60        # freezedetect 噪声容限（dB，越低越严格）
    min_duration: 1.0    # 冻结持续时长下限（秒）
    gap_factor: 2.0      # PTS 间隔超过标称帧间隔的倍数判定丢帧
    dup_min_frames: 4    # 重复帧卡顿：连续完全相同帧数下限（4帧≈0.13s@30fps）
    dup_diff: 0.05       # 重复帧判定：全分辨率帧间平均差上限
                         # （真重复帧≈0.001，静止画面≥0.46 有编码噪点，不可在缩略图上判定）
    glitch_diff: 35      # 突变坏帧：与前后帧的平均差下限（0-255）

  # 黑边：中位数初筛 + 外缘平整度校验（真黑边最外层绝对纯黑平整；
  # 夜景等暗画面的纹理会延伸到画面边缘，std 大 → 排除；带内有渗漏内容不影响）
  black_border:
    luma_threshold: 24       # 边缘亮度阈值（0-255，中位数统计，字幕/水印不影响）
    outer_strip: 8           # 最外缘校验条带宽度（px）
    outer_max_mean: 4        # 外缘条带平均亮度上限（真黑边≈0，夜景≈7+）
    outer_max_std: 2         # 外缘条带亮度标准差上限（真黑边≈0，夜景≈9+）
    inner_min_luma: 48       # 中心区域平均亮度下限，低于此视为黑场/转场不判黑边
    width_stability: 0.3     # 宽度允许波动比例（±30%），转场宽度剧变会被排除
    min_ratio: 0.005         # 黑边宽度占画面尺寸比例下限（0.5%，抓海报细边）
    sample_fps: 1            # 每秒采样帧数
    min_duration: 1.0        # 黑边持续时长下限（秒），过滤个别暗场景
    # 首/末帧海报检测（B 型：近黑渐变暗边 + 锐利台阶）
    edge_gap_luma: 30        # 暗边亮度上限（海报暗金渐变约 12-20）
    edge_jump: 80            # 暗边与内容的亮度台阶下限（海报≈150-180，渐变夜景≈0）

  # 爆音：双判据——削波（平头检测）+ 响度突刺，重叠时自动合并
  audio_clipping:
    clip_floor: 0.9          # 5ms 窗口峰值下限（满幅 1.0，低于此不判削波）
    clip_tolerance: 0.95     # 平头容差：样本幅值 ≥ 窗口峰值×该值计入平头
    clip_flat_ratio: 0.2     # 平头样本占窗口比例下限
    min_clip_ms: 10          # 削波持续毫秒数下限
    merge_gap: 0.2           # 间隔小于该秒数的区段合并
    spike_window: 0.1        # 响度分析窗口（秒）
    spike_db: 10             # 窗口响度高出局部基线该 dB 值判定为突刺
    spike_local: 5           # 局部基线邻域（±秒），持续响亮场景基线随抬不误报
    spike_floor_db: -25      # 窗口响度低于该值不判定（避免安静段落误报）
    max_spike_duration: 2.0  # 突刺最长持续（秒），超过视为音乐/场景音不判爆音
